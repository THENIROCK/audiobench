name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/analytics/dashboard.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    name: build + gh-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Refresh analytics dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE || 'audiobench' }}
        run: |
          python scripts/analytics/mentions.py || true
          python scripts/analytics/goatcounter_pull.py || true
          python scripts/analytics/dashboard.py --site

      - name: Build site (strict)
        run: mkdocs build --clean --strict

      - name: Deploy to gh-pages
        run: |
          git config user.name  "audiobench-bot"
          git config user.email "audiobench-bot@users.noreply.github.com"
          mkdocs gh-deploy --force --clean --message "deploy: ${{ github.sha }}"
