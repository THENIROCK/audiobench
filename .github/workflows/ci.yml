name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install audiobench (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -q

  smoke:
    name: smoke run + gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audiobench
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke run-matrix (sound-id + signal pillars)
        run: |
          mkdir -p results
          cat > results/gate.yaml <<'EOF'
          sound_id:
            min_weighted_recall: 0.25
            max_weighted_fpr: 0.5
          fidelity_roundtrip:
            min_weighted_si_sdr_db: 80.0
            max_true_peak_dbtp: 6.0
          psychoacoustic_masking:
            min_masking_respect_score: 0.99
          phase_coherence:
            min_phase_coherence_score: 0.99
            min_mean_polarity_score: 0.99
          sed_urban:
            min_event_f1: 0.99
            min_segment_f1: 0.99
          diarization_cw:
            max_der: 0.05
            max_speaker_count_error: 0.5
          EOF
          cat > results/matrix.yaml <<'EOF'
          output_dir: results/matrix
          cells:
            - suite: ab/sound-id
              model: heuristic-v0
              profile: demo-fast
            - suite: ab/sound-id
              model: heuristic-weak
              profile: demo-fast
            - suite: ab/fidelity-roundtrip
              model: passthrough
            - suite: ab/psychoacoustic-masking
              model: passthrough
            - suite: ab/phase-coherence
              model: passthrough
            - suite: ab/sed-urban
              model: oracle-sed
            - suite: ab/diarization-cw
              model: oracle-diarization
          EOF
          audiobench run-matrix \
            --matrix results/matrix.yaml \
            --gate results/gate.yaml \
            --junit results/matrix/junit.xml

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-matrix
          path: results/matrix/
